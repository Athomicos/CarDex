{% extends "layout.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 400px;">
    <h1 class="mb-4">Log In</h1>
    <form action="/login" method="post">
        <div class="mb-3">
            <input autocomplete="username" autofocus class="form-control" name="username" placeholder="Username" type="text">
        </div>
        <div class="mb-3">
            <input autocomplete="current-password" class="form-control" name="password" placeholder="Password" type="password">
        </div>
        <button class="btn btn-primary" type="submit">Log In</button>
    </form>
</div>
{% endblock %}
