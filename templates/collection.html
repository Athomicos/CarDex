{% extends "layout.html" %}
{% block title %}Mi Colección{% endblock %}
{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Mi Colección</h1>

    <div class="row">
        {% for car in user_cars %}
        <div class="col-12 col-md-6">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">{{ car.brand }} {{ car.model }}</h5>
                    <p class="card-text">Versión: {{ car.version }}</p>

                    {% if car.photo_path %}
                    <img src="{{ car.photo_path }}"
                         class="card-img-top" alt="Foto del coche">
                    {% else %}
                    <img src="{{ url_for('static', filename='uploads/no-car.jpg') }}"
                         class="card-img-top" alt="Sin foto">
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
